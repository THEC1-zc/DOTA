<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOTA Bot Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1419;
        --panel: #18222d;
        --border: #2a3948;
        --text: #e6edf3;
        --muted: #9fb0c0;
        --accent: #d4a72c;
        --good: #3fb950;
        --warn: #d29922;
        --bad: #f85149;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      .layout {
        display: grid;
        gap: 16px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 12px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      input {
        width: 100%;
        background: #0b1117;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
      }

      button {
        background: var(--accent);
        color: #111;
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }

      .headline {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
      }

      .headline p {
        color: var(--muted);
        line-height: 1.5;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .stat {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        background: #111922;
      }

      .stat-label {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 8px;
      }

      .stat-value {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.1;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        gap: 12px;
      }

      .section-head span {
        color: var(--muted);
        font-size: 14px;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .hero-item {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        background: #111922;
      }

      .hero-item strong {
        display: block;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
      }

      .hero-item span {
        display: block;
        font-size: 18px;
        font-weight: 600;
      }

      .ability-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .ability {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
        color: var(--text);
        background: #111922;
        font-size: 13px;
      }

      .status {
        font-size: 14px;
        color: var(--muted);
      }

      .status.good {
        color: var(--good);
      }

      .status.warn {
        color: var(--warn);
      }

      .status.bad {
        color: var(--bad);
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }

      @media (max-width: 820px) {
        .topbar,
        .stats,
        .hero-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="headline">
        <h1>DOTA Bot Dashboard</h1>
        <p>Track leaderboard stats, current live hero state, and the game slot where the bot is currently fighting.</p>
      </div>

      <div class="layout">
        <section class="panel">
          <div class="topbar">
            <label>
              Bot name
              <input id="agentName" value="THEC1-BOT" />
            </label>
            <button id="refreshButton">Refresh</button>
            <button id="autoButton" class="secondary">Auto: On</button>
          </div>
        </section>

        <section class="panel">
          <div class="section-head">
            <h2>Leaderboard</h2>
            <span id="lastUpdated">Waiting for first refresh</span>
          </div>
          <div class="stats">
            <div class="stat">
              <div class="stat-label">Games Played</div>
              <div class="stat-value" id="gamesPlayed">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">Wins</div>
              <div class="stat-value" id="gamesWon">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">Losses</div>
              <div class="stat-value" id="gamesLost">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">Win Rate</div>
              <div class="stat-value" id="winRate">n/a</div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="section-head">
            <h2>Live Hero</h2>
            <span id="liveStatus" class="status">Searching active games</span>
          </div>
          <div class="hero-grid">
            <div class="hero-item">
              <strong>Game</strong>
              <span id="gameId" class="mono">-</span>
            </div>
            <div class="hero-item">
              <strong>Faction</strong>
              <span id="faction">-</span>
            </div>
            <div class="hero-item">
              <strong>Class</strong>
              <span id="heroClass">-</span>
            </div>
            <div class="hero-item">
              <strong>Lane</strong>
              <span id="lane">-</span>
            </div>
            <div class="hero-item">
              <strong>Level</strong>
              <span id="level">-</span>
            </div>
            <div class="hero-item">
              <strong>HP</strong>
              <span id="hp">-</span>
            </div>
          </div>
          <div style="margin-top: 16px;">
            <div class="section-head" style="margin-bottom: 10px;">
              <h2 style="font-size: 18px;">Abilities</h2>
            </div>
            <div id="abilities" class="ability-list"></div>
          </div>
        </section>
      </div>
    </main>

    <script>
      const API_BASE = "https://wc2-agentic-dev-3o6un.ondigitalocean.app/api";
      const MAX_GAMES_TO_SCAN = 5;
      const REFRESH_MS = 60000;

      const elements = {
        agentName: document.getElementById("agentName"),
        refreshButton: document.getElementById("refreshButton"),
        autoButton: document.getElementById("autoButton"),
        lastUpdated: document.getElementById("lastUpdated"),
        gamesPlayed: document.getElementById("gamesPlayed"),
        gamesWon: document.getElementById("gamesWon"),
        gamesLost: document.getElementById("gamesLost"),
        winRate: document.getElementById("winRate"),
        liveStatus: document.getElementById("liveStatus"),
        gameId: document.getElementById("gameId"),
        faction: document.getElementById("faction"),
        heroClass: document.getElementById("heroClass"),
        lane: document.getElementById("lane"),
        level: document.getElementById("level"),
        hp: document.getElementById("hp"),
        abilities: document.getElementById("abilities"),
      };

      let autoRefresh = true;
      let timerId = null;

      function setAggregateStats(entry) {
        const gamesPlayed = entry?.games_played ?? 0;
        const gamesWon = entry?.games_won ?? 0;
        const gamesLost = Math.max(0, gamesPlayed - gamesWon);
        const winRate = gamesPlayed > 0 ? `${((gamesWon / gamesPlayed) * 100).toFixed(1)}%` : "n/a";

        elements.gamesPlayed.textContent = String(gamesPlayed);
        elements.gamesWon.textContent = String(gamesWon);
        elements.gamesLost.textContent = String(gamesLost);
        elements.winRate.textContent = winRate;
      }

      function setLiveState(hero, gameId) {
        if (!hero) {
          elements.liveStatus.textContent = "Bot not found in active game scan";
          elements.liveStatus.className = "status warn";
          elements.gameId.textContent = "-";
          elements.faction.textContent = "-";
          elements.heroClass.textContent = "-";
          elements.lane.textContent = "-";
          elements.level.textContent = "-";
          elements.hp.textContent = "-";
          elements.abilities.innerHTML = "";
          return;
        }

        elements.liveStatus.textContent = hero.alive ? "Hero found and alive" : "Hero found but currently dead";
        elements.liveStatus.className = hero.alive ? "status good" : "status bad";
        elements.gameId.textContent = String(gameId);
        elements.faction.textContent = hero.faction ?? "-";
        elements.heroClass.textContent = hero.class ?? "-";
        elements.lane.textContent = hero.lane ?? "-";
        elements.level.textContent = hero.level ?? "-";
        elements.hp.textContent = `${hero.hp ?? 0}/${hero.maxHp ?? 0}`;
        elements.abilities.innerHTML = "";

        const abilities = Array.isArray(hero.abilities) ? hero.abilities : [];
        if (abilities.length === 0) {
          const empty = document.createElement("span");
          empty.className = "ability";
          empty.textContent = "No learned abilities";
          elements.abilities.appendChild(empty);
          return;
        }

        for (const ability of abilities) {
          const chip = document.createElement("span");
          chip.className = "ability";
          chip.textContent = `${ability.id} Lv.${ability.level}`;
          elements.abilities.appendChild(chip);
        }
      }

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        return response.json();
      }

      async function fetchLeaderboardEntry(agentName) {
        const entries = await fetchJson(`${API_BASE}/leaderboard?type=ai`);
        return entries.find((entry) => entry.name === agentName) ?? null;
      }

      async function findLiveHero(agentName) {
        for (let gameId = 1; gameId <= MAX_GAMES_TO_SCAN; gameId += 1) {
          try {
            const state = await fetchJson(`${API_BASE}/game/state?game=${gameId}`);
            const heroes = Array.isArray(state.heroes) ? state.heroes : [];
            const hero = heroes.find((candidate) => candidate.name === agentName);
            if (hero) {
              return { hero, gameId };
            }
          } catch (error) {
            // Ignore a single bad game slot and keep scanning.
          }
        }

        return { hero: null, gameId: null };
      }

      async function refresh() {
        const agentName = elements.agentName.value.trim();
        if (!agentName) {
          return;
        }

        elements.refreshButton.disabled = true;
        elements.liveStatus.textContent = "Refreshing";
        elements.liveStatus.className = "status";

        try {
          const [leaderboardEntry, live] = await Promise.all([
            fetchLeaderboardEntry(agentName),
            findLiveHero(agentName),
          ]);

          setAggregateStats(leaderboardEntry);
          setLiveState(live.hero, live.gameId);
          elements.lastUpdated.textContent = `Updated ${new Date().toLocaleString()}`;
        } catch (error) {
          elements.liveStatus.textContent = `Refresh failed: ${error.message}`;
          elements.liveStatus.className = "status bad";
        } finally {
          elements.refreshButton.disabled = false;
        }
      }

      function scheduleRefresh() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }

        if (autoRefresh) {
          timerId = setInterval(refresh, REFRESH_MS);
        }
      }

      elements.refreshButton.addEventListener("click", refresh);
      elements.autoButton.addEventListener("click", () => {
        autoRefresh = !autoRefresh;
        elements.autoButton.textContent = autoRefresh ? "Auto: On" : "Auto: Off";
        scheduleRefresh();
      });
      elements.agentName.addEventListener("change", refresh);

      scheduleRefresh();
      refresh();
    </script>
  </body>
</html>
