name: DOTA Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: dota-agent
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOTA_AGENT_NAME: THEC1-BOT
      DOTA_API_KEY: ${{ secrets.DOTA_API_KEY }}
      DOTA_STRATEGY_JSON: ${{ secrets.DOTA_STRATEGY_JSON }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DOTA_API_KEY:-}" ]]; then
            echo "Missing DOTA_API_KEY secret" >&2
            exit 1
          fi

          mkdir -p config
          jq -n \
            --arg apiKey "$DOTA_API_KEY" \
            --arg agentName "$DOTA_AGENT_NAME" \
            --arg registeredAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{apiKey: $apiKey, agentName: $agentName, registeredAt: $registeredAt}' > config/credentials.json

      - name: Restore runtime from published status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p config
          if [[ -f docs/status.json ]]; then
            jq '.runtime // {}' docs/status.json > config/runtime.json
          fi

      - name: Prepare optional strategy
        if: ${{ env.DOTA_STRATEGY_JSON != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p config
          printf '%s\n' "$DOTA_STRATEGY_JSON" | jq . > config/strategy.json

      - name: Run bot session
        shell: bash
        run: bash scripts/run-session.sh 3 110

      - name: Build dashboard status
        shell: bash
        run: bash scripts/publish-status.sh

      - name: Commit dashboard status
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/status.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json
          git commit -m "Update bot dashboard status"
          git push
